const good=(q,b)=>{const x=p3.pl[q][b];return x>=0&&W3[q][x]==W3[q][b]},solved=q=>p3.ck[q]&&W3[q].every((_,b)=>good(q,b));
const put=(q,b,ix)=>{if(solved(q))return;p3.pl[q]=p3.pl[q].map(x=>x==ix?-1:x);p3.pl[q][b]=ix;p3.ck[q]=0};
const dr=(e,q,b)=>{e.preventDefault();const[qq,ix]=e.dataTransfer.getData("text").split(",").map(Number);if(qq==q){put(q,b,ix);r()}};
const cs=(q,ix)=>{p3.sel={q,ix};r()};
const bk=(q,b)=>{if(solved(q))return;if(p3.sel&&p3.sel.q==q){put(q,b,p3.sel.ix);p3.sel=null}else{p3.pl[q][b]=-1;p3.ck[q]=0}r()};
const ck=q=>{if(p3.pl[q].includes(-1)){alert("Hãy điền hết các ô trống!");return}p3.ck[q]=1;r()};
const p3f=()=>{const sc=I3.filter((_,q)=>solved(q)).length;const rows=I3.map((it,q)=>{let b=0;const parts=pz(it[0]).map((t,k)=>{if(k%2==0)return T(t);const x=p3.pl[q][b],cur=b++;return `<span class="slot drop ${p3.ck[q]?(good(q,cur)?'ok':'no'):''}" ondragover="event.preventDefault()" ondrop="dr(event,${q},${cur})" onclick="bk(${q},${cur})">${x>=0?T(W3[q][x]):"＿＿＿"}</span>`}).join("");
const used=p3.pl[q];return `<div class=card><div class=z>${parts}</div>${solved(q)?`<div class=p>${P([["",pz(it[1]).join("")]])}</div>${sp(pz(it[0]).join(""))} ✅`:`<div class=chips>${p3.sh[q].filter(ix=>!used.includes(ix)).map(ix=>`<div class="chip ${p3.sel&&p3.sel.q==q&&p3.sel.ix==ix?'on':''}" draggable=true ondragstart="event.dataTransfer.setData('text','${q},${ix}')" onclick="cs(${q},${ix})">${z(W3[q][ix],PW[q][ix])}</div>`).join("")}</div><button onclick="ck(${q})">Kiểm tra</button>${p3.ck[q]?' <span style="color:#c0392b">❌ Chưa đúng, bấm ô đỏ để bỏ từ rồi chọn lại.</span>':''}`}</div>`}).join("");
return `<h2>${T("练习")} 3 · Kéo thả từ vào chỗ trống</h2><p class=vi>Kéo (hoặc bấm chọn từ rồi bấm vào ô trống). Điền xong bấm "Kiểm tra" ở từng câu.</p>${rows}<h3>Đúng ${sc}/${I3.length} câu</h3><button onclick="i3();r()">Làm lại</button>`};

const H=[["Trưa nay bạn đi đâu ăn cơm?","中午你去哪儿吃饭？","Zhōngwǔ nǐ qù nǎr chī fàn?"],["Tôi đi nhà ăn.","我去食堂。","Wǒ qù shítáng."],["Bạn ăn gì?","你吃什么？","Nǐ chī shénme?"],["Tôi ăn mantou, không ăn cơm.","我吃馒头，不吃米饭。","Wǒ chī mántou, bù chī mǐfàn."],["Bạn lấy mấy cái bánh bao?","你要几个包子？","Nǐ yào jǐ ge bāozi?"],["Tôi lấy một cái.","我要一个。","Wǒ yào yí ge."],["Bạn uống bia không?","你喝啤酒吗？","Nǐ hē píjiǔ ma?"],["Tôi không uống bia, tôi uống canh.","我不喝啤酒，我喝汤。","Wǒ bù hē píjiǔ, wǒ hē tāng."],["Tôi muốn một bát canh trứng.","我要一碗鸡蛋汤。","Wǒ yào yì wǎn jīdàn tāng."],["Đây là gì? Đây là sủi cảo, kia là mì.","这是什么？这是饺子，那是面条。","Zhè shì shénme? Zhè shì jiǎozi, nà shì miàntiáo."]];
let hw=H.map(()=>""),hs=0;
const nm=s=>N(s.replace(/[\s，。？！,.?!]/g,""));
const hwf=()=>`<h2>📝 Bài tập về nhà: dịch sang tiếng Trung</h2><p class=vi>Điền đủ 10 câu rồi bấm Nộp bài thì đáp án mới hiện.</p><div style="width:100%">${H.map((h,n)=>`<div class=card style="text-align:left"><b>${n+1}.</b> ${h[0]}<input class=hw ${hs?"disabled":""} value="${hw[n].replace(/"/g,"&quot;")}" oninput="hw[${n}]=this.value">${hs?`<div>${nm(hw[n])==nm(h[1])?"✅ Đúng":"❌ Chưa khớp đáp án mẫu"} ${sp(h[1])}</div>${z(h[1],h[2])}`:""}</div>`).join("")}</div>${hs?'<button onclick="hw=H.map(()=>\'\');hs=0;r()">Làm lại</button>':'<button onclick="if(hw.some(x=>!x.trim()))alert(\'Hãy điền đủ 10 câu trước khi nộp!\');else{hs=1;r()}">Nộp bài</button>'}`;
// Trò chơi từ vựng (hữu hạn)
let g;const mk=()=>{const a=g.q[g.k];if(a==null)return;let o=[a];while(o.length<4){const k=Math.random()*V.length|0;if(!o.includes(k))o.push(k)}g.o=shuf(o);g.d=null},ng=()=>{g={q:shuf([...V.keys()]),k:0,s:0,d:null};mk()};ng();
const pick=j=>{if(g.d!=null)return;g.d=j;if(g.o[j]==g.q[g.k])g.s++;r()};
const sv=k=>`<svg viewBox="0 0 100 100">${S[k]}</svg>`;

return `<h2>🎮 Đoán từ ${g.k+1}/${V.length} · Điểm: ${g.s}</h2><div class=card>${sv(a[6])}<div class=vi>${a[2]} <button onclick="say('${a[0]}')">🔊 Nghe</button></div></div><div class=chips>${g.o.map((k,j)=>`<div class="chip ${g.d!=null?(k==g.q[g.k]?'ok':j==g.d?'no':''):''}" onclick="pick(${j})">${z(V[k][0],V[k][1])}</div>`).join("")}</div>${g.d!=null?'<button onclick="g.k++;mk();r()">Tiếp ▶</button>':''}`};
const sl=[
()=>`<h1>${T("第七课")}</h1><div class=z style="font-size:48px">${T("你吃什么")}</div><div class=p>Dì qī kè · Nǐ chī shénme</div><p class=vi>Bài 7: Bạn ăn gì?<br>课文 · 练习 · 生词 · Trò chơi · Luyện tập · Bài tập về nhà</p>`,
()=>`<h2>${T("课文")} · Video</h2><iframe src="https://www.youtube.com/embed/claG9ikKOrc" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><a class=btn target=_blank rel=noopener href="https://www.youtube.com/watch?v=claG9ikKOrc">▶ Mở video trên YouTube</a><p class=vi>Nếu khung video báo lỗi 153 (thường do mở file trực tiếp từ ổ đĩa), hãy dùng nút trên hoặc chạy file qua http://localhost.</p>`,
...D.map((_,n)=>()=>`<h2>${T("课文")} ${n+1}/11</h2><div style="width:100%">${D.slice(0,n+1).map(d=>bub(d,z(Z(d[1]),P(d[1])))).join("")}</div>`),
p1,
...V.map((v,n)=>()=>`<h2>${T("生词")} ${n+1}/${V.length}</h2><div class="card big">${sv(v[6])}${z(v[0],v[1])}<div class=vi>${v[2]} ${sp(v[0])}</div><hr>${z(v[3],v[4])}<div class=vi>${v[5]} ${sp(v[3])}</div></div>`),
game,p2,p3f,hwf];
const go=d=>{i=Math.max(0,Math.min(sl.length-1,i+d));r()};
let li=-1;function r(){speechSynthesis.cancel();const st=s.scrollTop,tp=(i>=2&&i<14)||i>14+V.length;s.innerHTML=`<div class="w ${tp?'tp':''}">${sl[i]()}</div>`;s.scrollTop=i!=li?((i>=2&&i<13)?s.scrollHeight:0):st;li=i;
document.querySelector("#prog i").style.width=(i+1)/sl.length*100+"%";pv.disabled=!i;nx.disabled=i==sl.length-1;tb.textContent=trad?"繁 → 简":"简 → 繁"}
